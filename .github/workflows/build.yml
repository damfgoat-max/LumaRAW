name: Build LumaRAW

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (code signing disabled)
        run: |
          xcodebuild -project LumaRAW.xcodeproj \
            -scheme LumaRAW \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          echo "Packaging $APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r LumaRAW.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaRAW-ipa
          path: LumaRAW.ipa

  unit-tests:
    name: Unit tests (simulator, non-blocking)
    runs-on: macos-14
    # Per spec: run the LUTParser tests when a simulator is available, but
    # never let a simulator problem fail the deliverable device build.
    continue-on-error: true
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run LUTParser unit tests
        run: |
          xcodebuild test -project LumaRAW.xcodeproj \
            -scheme LumaRAW \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

  # ---------------------------------------------------------------------------
  # OPTIONAL: signed build + TestFlight upload (disabled — uncomment to use).
  #
